name: Forward package PR to monorepo

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  forward:
    if: github.repository_owner == 'capell-app' && github.event.repository.name != 'capell-packages'
    uses: capell-app/capell-packages/.github/workflows/forward-split-package-pr.yml@main
    with:
      package-name: socials
      source-pr-number: ${{ github.event.pull_request.number }}
      source-pr-title: ${{ github.event.pull_request.title }}
      source-pr-author: ${{ github.event.pull_request.user.login }}
      source-pr-url: ${{ github.event.pull_request.html_url }}
      source-pr-base: ${{ github.event.pull_request.base.ref }}
      source-pr-head: ${{ github.event.pull_request.head.ref }}
      source-pr-state: ${{ github.event.action }}
    secrets: inherit
